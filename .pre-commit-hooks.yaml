# pre-commit hooks: https://pre-commit.com/#creating-new-hooks
# The IDF and unit test hooks need the IDD to use (the IDD hook doesn't take it), given in the repo's .pre-commit-config.yaml, eg for EnergyPlus:
#   args: [--idd, idd/Energy+.idd.in]
# Files are reformatted in place: pre-commit then fails if any was changed, so you can review and stage them.
# require_serial: the CLI runs its own process pool and loads the IDD once.

- id: energyplus-format-idf
  name: Reformat EnergyPlus IDF files
  description: Reformat IDF files (IMF and parametric files are skipped, nothing is ever lost).
  entry: energyplus-toolkit format idf
  language: python
  files: \.idf$
  require_serial: true

- id: energyplus-format-idd
  name: Reformat EnergyPlus IDD files
  description: Reformat IDD files (Energy+.idd, Energy+.idd.in).
  entry: energyplus-toolkit format idd
  language: python
  files: \.idd(\.in)?$
  require_serial: true

- id: energyplus-format-unit-test
  name: Reformat the IDF in EnergyPlus C++ unit tests
  description: Reformat the IDF in delimited_string({...}) and R"IDF(...)IDF" blocks. Run clang-format after it.
  entry: energyplus-toolkit format unit-test
  language: python
  files: \.unit\.cc$
  require_serial: true

- id: energyplus-lint-idd
  name: Lint EnergyPlus IDD files
  description: Report problems in IDD files (field ids, extensible groups, types, units, stray tags), which aren't changed.
  entry: energyplus-toolkit lint idd
  language: python
  files: \.idd(\.in)?$
  require_serial: true
