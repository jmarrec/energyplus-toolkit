name: dev workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        # macOS and Windows start the worker processes with spawn, not fork: each worker loads the IDD itself
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # The oldest supported version (StrEnum: 3.11+)
          - python-version: '3.11'
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run pre-commit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: pytest --cov=energyplus_toolkit --cov-branch --cov-report=term-missing tests
